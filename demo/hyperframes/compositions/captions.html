<template><style>@font-face{font-family:Geist;src:url('assets/fonts/geist.woff2');font-weight:100 900}#root{position:absolute;inset:0;pointer-events:none}.caption{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:0 128px 72px}.caption p{margin:0;padding:10px 18px;background:#090a0f;color:#eef1f8;font:500 24px/1.25 Geist,sans-serif;text-align:center;max-width:1024px;border-radius:8px}</style><div id="root" data-composition-id="captions" data-width="1280" data-height="720" data-duration="120" data-no-timeline><div id="caption-0" class="clip caption" data-start="0.700" data-duration="4.607" data-track-index="1"><p>We built Hostless Hui, a rotating savings circle where hosting</p></div>
<div id="caption-1" class="clip caption" data-start="5.307" data-duration="4.607" data-track-index="1"><p>the application does not automatically give someone access to a</p></div>
<div id="caption-2" class="clip caption" data-start="9.914" data-duration="4.607" data-track-index="1"><p>release code. Members contribute together. The receiving turn changes by</p></div>
<div id="caption-3" class="clip caption" data-start="14.521" data-duration="4.607" data-track-index="1"><p>cycle. We separate three powers: operating the platform, approving access,</p></div>
<div id="caption-4" class="clip caption" data-start="19.128" data-duration="1.843" data-track-index="1"><p>and redeeming a release.</p></div>
<div id="caption-5" class="clip caption" data-start="25.700" data-duration="4.402" data-track-index="1"><p>In a conventional application, the operator who controls the server</p></div>
<div id="caption-6" class="clip caption" data-start="30.102" data-duration="4.402" data-track-index="1"><p>can often change permissions or inspect stored secrets. A login</p></div>
<div id="caption-7" class="clip caption" data-start="34.504" data-duration="4.402" data-track-index="1"><p>screen does not remove that power. For a savings circle,</p></div>
<div id="caption-8" class="clip caption" data-start="38.906" data-duration="4.402" data-track-index="1"><p>the question is simple: can the group approve access without</p></div>
<div id="caption-9" class="clip caption" data-start="43.308" data-duration="3.081" data-track-index="1"><p>trusting one host to control every decision?</p></div>
<div id="caption-10" class="clip caption" data-start="50.400" data-duration="4.641" data-track-index="1"><p>This working prototype uses explicitly simulated identities and governance. Bao</p></div>
<div id="caption-11" class="clip caption" data-start="55.041" data-duration="4.641" data-track-index="1"><p>is the recipient for cycle four. Operator tries opening and</p></div>
<div id="caption-12" class="clip caption" data-start="59.681" data-duration="4.641" data-track-index="1"><p>is denied. Asking for access creates a pending request, not</p></div>
<div id="caption-13" class="clip caption" data-start="64.322" data-duration="4.641" data-track-index="1"><p>a grant. Hanh approves once; access is still denied. Tuan's</p></div>
<div id="caption-14" class="clip caption" data-start="68.963" data-duration="4.641" data-track-index="1"><p>independent approval commits the change. Operator can now read the</p></div>
<div id="caption-15" class="clip caption" data-start="73.604" data-duration="4.641" data-track-index="1"><p>sample package, but cannot redeem Bao's turn. Only the scheduled</p></div>
<div id="caption-16" class="clip caption" data-start="78.244" data-duration="4.641" data-track-index="1"><p>recipient can redeem once. TideCloak is the intended cryptographic boundary:</p></div>
<div id="caption-17" class="clip caption" data-start="82.885" data-duration="4.641" data-track-index="1"><p>signed record policies and ORK-mediated decryption should enforce these rights</p></div>
<div id="caption-18" class="clip caption" data-start="87.526" data-duration="4.641" data-track-index="1"><p>beyond the application server. Our integration is implemented, but live</p></div>
<div id="caption-19" class="clip caption" data-start="92.167" data-duration="3.713" data-track-index="1"><p>encryption, decryption and quorum remain to be verified.</p></div>
<div id="caption-20" class="clip caption" data-start="100.200" data-duration="4.619" data-track-index="1"><p>The possibility is a group that can share oversight without</p></div>
<div id="caption-21" class="clip caption" data-start="104.819" data-duration="4.619" data-track-index="1"><p>handing one operator permanent authority. Access rotates, approvals are visible,</p></div>
<div id="caption-22" class="clip caption" data-start="109.438" data-duration="4.619" data-track-index="1"><p>and renewal or revocation requires review. This prototype models disclosure,</p></div>
<div id="caption-23" class="clip caption" data-start="114.057" data-duration="4.619" data-track-index="1"><p>not financial custody. Tide's live cryptographic proof is the next</p></div>
<div id="caption-24" class="clip caption" data-start="118.676" data-duration="0.924" data-track-index="1"><p>acceptance gate.</p></div></div></template>
